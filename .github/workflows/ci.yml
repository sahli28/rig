name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` : le contrôle des migrations compare à l'ancêtre commun
      # avec la branche de base. Un clone superficiel n'en a pas, et le script
      # sortirait « rien à vérifier » — vert, muet, et faux.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # **Les interdits mordent-ils encore ?** `pnpm lint` au vert ne dit pas
      # qu'une règle s'applique, seulement qu'elle n'a rien trouvé — et le
      # 3 septembre 2026, ajouter un second bloc `no-restricted-syntax` a
      # désactivé le premier sans qu'aucune commande le signale.
      #
      # Cette étape est ici et pas seulement dans `/check` parce qu'un garde qui
      # ne s'exécute que si on y pense a exactement la faiblesse qu'il garde.
      - name: Les interdits ESLint mordent-ils encore ?
        run: pnpm lint:sondes

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      # L'émetteur de push (P1-007) tourne sous Deno, le vrai moteur de cette
      # brique — donc ses fonctions pures (rendu i18n du message, lecture de la
      # réponse Expo) se testent sous Deno, pas sous Node. Ce n'est pas une
      # violation de D-010 : Deno EST le moteur ici, contrairement à Vitest sous
      # Node pour du code qui part tourner sous Hermes.
      - name: Deno (émetteur push)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fonctions edge · rendu i18n et mapping Expo
        run: pnpm test:functions

      - name: Parité des traductions
        run: pnpm i18n:check

      - name: Format
        run: pnpm format:check

      # **Une migration déjà versionnée a-t-elle changé ?** Le hook
      # `guard-migrations.mjs` ne s'exécute que sur Edit et Write : un script
      # lancé en Bash écrit le même fichier sans qu'il le voie, ce qui est arrivé
      # au renommage D-013. Ce contrôle-ci regarde le résultat plutôt que
      # l'intention, donc il voit toutes les écritures.
      #
      # Il **avertit** tant qu'aucune base de production n'existe (règle 13 de
      # CLAUDE.md), et une constante du script bascule le jour venu. Le mode est
      # imprimé à chaque exécution : un garde dont on ignore l'état ne garde rien.
      - name: Les migrations versionnées sont-elles intactes ?
        run: pnpm migrations:immuables

      # Le bundle web de l'app mobile. Il ne remplace pas un appareil, mais il
      # est le seul harnais qui exerce le routeur et les écrans sans téléphone —
      # et il a servi le jour même à localiser la perte du jeton d'invitation.
      #
      # Il est ici parce qu'il a **déjà** pourri une fois en silence :
      # `lib/supabase.ts` portait une branche `webStore` justifiée par « les
      # démos du kit sur le web » pendant que le bundle échouait sur
      # `Unable to resolve "react-native-web/dist/index"`. Une cible revendiquée
      # et jamais construite est une cible morte, et personne ne le remarque.
      - name: Bundle web de l'app mobile
        run: pnpm --filter @rack/mobile build:web

  database:
    name: base · isolation multi-tenant · T1 concurrence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les tests pgTAP arrivent avec le premier schéma (ticket P0-004).
      # Tant qu'aucun n'existe, le job passe en annonçant qu'il n'a rien exécuté —
      # il ne doit jamais passer *silencieusement* une fois les tests écrits.
      - name: Détecter les tests pgTAP
        id: detect
        run: |
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun test pgTAP — attendu jusqu'au ticket P0-004."
          fi

      - name: Démarrer Supabase
        if: steps.detect.outputs.found == 'true'
        run: pnpm exec supabase start

      - name: Tests base et anti-fuite inter-tenant
        if: steps.detect.outputs.found == 'true'
        run: pnpm test:db

      # T1 de la spec §16.4 — seuil « doubles réservations : 0 ».
      #
      # Ce test ne peut pas vivre dans pgTAP : un fichier pgTAP tourne dans une
      # seule session, et `book_class()` y passerait au vert sans le moindre
      # `for update`. Il ouvre donc N connexions réelles qui se réveillent au
      # même instant, sur un cours à une place.
      #
      # POURQUOI 60 ET NON 200. La spec demande 200 tentatives. Sur ce moteur,
      # `max_connections = 100` : au-delà d'une soixantaine de sessions, les
      # suivantes n'obtiennent pas de connexion et n'atteignent jamais la
      # fonction. Mesuré en local, et non plus déduit — le harnais échantillonne
      # `pg_stat_activity` et affiche « contention observée » à chaque vague. Un
      # run à 200 donne **59 sessions croisées dans la fonction**, puis 141
      # tentatives qui se contentent de reconfirmer qu'un cours plein reste plein.
      #
      # 60 achète donc exactement la même preuve que 200 — la contention
      # maximale que le moteur accepte — pour un cinquième du temps. Ce que 200
      # ajoute est la répétition, pas la démonstration.
      #
      # CE QUE CETTE ÉTAPE NE PROUVE PAS : le T1 littéral de la spec, ses 200
      # tentatives, ni le p95 sous charge (qui suppose un appel HTTP, donc le
      # lot 2 de P1-003). **Avant chaque jalon**, lancer à la main :
      #
      #     pnpm test:db:concurrency        # 200, la valeur de la spec
      #
      # Le harnais refuse les faux verts, de deux façons : si des sessions n'ont
      # pas atteint la fonction, leurs refus ne sont pas comptés comme métier ;
      # et si moins de deux sessions se sont croisées, il échoue — un run sans
      # contention prouverait exactement rien.
      - name: T1 · aucune double réservation sous contention
        if: steps.detect.outputs.found == 'true'
        run: pnpm test:db:concurrency 60

      # P1-004 — la sœur de T1, et son invariant n'est pas le même.
      #
      # Ici on ne compte pas les réservations confirmées : on vérifie que
      # `booked_count` **égale** leur nombre après la tempête. Un décrément perdu
      # fait dériver le compteur vers le haut, et le cours reste complet pour
      # toujours alors qu'il a des places — personne ne peut plus réserver, et
      # rien ne le signale. C'est la panne la plus coûteuse de cette famille :
      # silencieuse, et elle dure.
      #
      # Un tiers des sessions détient une place et l'annule, deux tiers tentent
      # de réserver, tous au même instant : les incréments croisent les
      # décréments sur toute la ruée.
      - name: P1-004 · le compteur survit à annuler et réserver ensemble
        if: steps.detect.outputs.found == 'true'
        run: pnpm test:db:concurrency 60 --scenario cancel
